name: Bug report
description: Report a reproducible problem in the synthetic demo.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include real applicant information, credit reports,
        credentials, tokens, production payloads, or other confidential data.
  - type: input
    id: component
    attributes:
      label: Affected component
      placeholder: Kestra flow, AIDflow inference, UWflow decision, report renderer...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Python and Kestra versions
      placeholder: Python 3.11.x; Kestra version/image tag
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a minimal synthetic example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I have removed personal, applicant, financial, and confidential data.
          required: true
        - label: I have removed credentials, access tokens, and secrets.
          required: true
