name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify generated policy module
        run: python -m tools.policy.compiler --check

      - name: Run tests
        run: python -m pytest -q

      - name: Check formatting
        run: ruff format --check core modules tests tools

      - name: Check lint
        run: ruff check core modules tests tools

      - name: Compile Python sources
        run: python -m compileall -q core modules tests tools

      - name: Verify immutable Kestra runtime release
        run: python -m core.underwriting.tools.runtime_bundle --check

      - name: Build or reuse immutable historical replay tooling
        run: python -m modules.history.tools.history_tools_bundle

      - name: Verify immutable historical replay tooling
        run: python -m modules.history.tools.history_tools_bundle --check

      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build
