services:
  uwflow-history-db:
    image: postgres:17-bookworm
    container_name: uwflow-history-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${UWFLOW_HISTORY_DB:-uwflow_history}
      POSTGRES_USER: ${UWFLOW_HISTORY_OWNER_USER:-uwflow_history_owner}
      POSTGRES_PASSWORD: ${UWFLOW_HISTORY_OWNER_PASSWORD:?Run bash tools/guides/workflow/04-create-history-credentials.sh first}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${UWFLOW_HISTORY_PORT:-55432}:5432"
    volumes:
      - uwflow_history_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - uwflow-local

volumes:
  uwflow_history_pgdata:
    name: uwflow_history_pgdata

networks:
  uwflow-local:
    external: true
    name: uwflow-local
